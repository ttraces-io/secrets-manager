name: Release Application & Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release-binaries:
    name: Build Release Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli_artifact: traces-sm-linux-x86_64
            desktop_artifact: traces-sm-desktop-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cli_artifact: traces-sm-windows-x86_64.exe
            desktop_artifact: traces-sm-desktop-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            cli_artifact: traces-sm-macos-aarch64
            desktop_artifact: traces-sm-desktop-macos-aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            cli_artifact: traces-sm-macos-x86_64
            desktop_artifact: traces-sm-desktop-macos-x86_64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binaries (CLI & Desktop)
        run: |
          cargo build --release --target ${{ matrix.target }} -p traces-sm -p traces-sm-desktop

      - name: Prepare Binary Artifacts
        shell: bash
        run: |
          mkdir -p release_assets
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/traces-sm.exe release_assets/${{ matrix.cli_artifact }}
            cp target/${{ matrix.target }}/release/traces-sm-desktop.exe release_assets/${{ matrix.desktop_artifact }}
          else
            cp target/${{ matrix.target }}/release/traces-sm release_assets/${{ matrix.cli_artifact }}
            cp target/${{ matrix.target }}/release/traces-sm-desktop release_assets/${{ matrix.desktop_artifact }}
          fi

      - name: Upload Binary Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release_assets/*

  create-github-release:
    name: Create & Publish GitHub Release
    needs: build-release-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_assets/

      - name: Consolidate Binaries and Generate Checksums
        run: |
          mkdir -p release_dist
          find downloaded_assets/ -type f -exec cp {} release_dist/ \;
          cd release_dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/*
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || inputs.version }}
          name: Release ${{ github.ref_name != 'main' && github.ref_name || inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
